name: Deploy to AWS EC2

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<'ENDSSH'

          set -e

          APP_DIR="$HOME/debate-colosseum"

          ####################################
          # Clone repository if first deploy
          ####################################
          if [ ! -d "$APP_DIR/.git" ]; then
            echo "==> Cloning repository..."
            git clone https://github.com/neeldholiya04/debate_colosseum.git "$APP_DIR"
          fi

          ####################################
          # Pull latest code
          ####################################
          cd "$APP_DIR"

          git fetch origin production
          git reset --hard origin/production

          ####################################
          # Backend .env
          ####################################
          cat > .env <<'EOF'
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
          LLM_MODEL=${{ secrets.LLM_MODEL }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT=${{ secrets.GOOGLE_CLOUD_PROJECT }}
          LANGSMITH_TRACING=true
          LANGSMITH_ENDPOINT=https://api.smith.langchain.com
          LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT=${{ secrets.LANGSMITH_PROJECT }}
          SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
          EOF

          ####################################
          # Frontend .env
          ####################################
          mkdir -p frontend-next

          cat > frontend-next/.env.local <<'EOF'
          NEXT_PUBLIC_API_BASE=${{ secrets.NEXT_PUBLIC_API_BASE }}/api
          EOF

          ####################################
          # Python environment
          ####################################
          if [ ! -d ".venv" ]; then
              python3 -m venv .venv
          fi

          source .venv/bin/activate

          pip install --upgrade pip
          pip install -r requirements.txt

          ####################################
          # Frontend
          ####################################
          cd frontend-next

          npm ci
          npm run build

          cd ..

          ####################################
          # Install systemd services
          ####################################
          sudo cp deploy/debate-backend.service /etc/systemd/system/
          sudo cp deploy/debate-frontend.service /etc/systemd/system/

          sudo systemctl daemon-reload

          sudo systemctl enable debate-backend
          sudo systemctl enable debate-frontend

          ####################################
          # Install nginx config
          ####################################
          sudo cp deploy/nginx.conf /etc/nginx/sites-available/debate-colosseum

          sudo ln -sf \
            /etc/nginx/sites-available/debate-colosseum \
            /etc/nginx/sites-enabled/debate-colosseum

          sudo rm -f /etc/nginx/sites-enabled/default

          sudo nginx -t
          sudo systemctl reload nginx

          ####################################
          # Restart services
          ####################################
          sudo systemctl restart debate-backend
          sudo systemctl restart debate-frontend

          ENDSSH

      - name: Health Check Frontend
        run: |
          for i in {1..12}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://${{ secrets.EC2_HOST }}/)

            if [ "$STATUS" = "200" ]; then
              echo "Frontend healthy"
              exit 0
            fi

            sleep 5
          done

          exit 1

      - name: Health Check Backend
        run: |
          for i in {1..12}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://${{ secrets.EC2_HOST }}/docs)

            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy"
              exit 0
            fi

            sleep 5
          done

          exit 1
